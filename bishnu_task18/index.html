<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="greeting">Hello</h1>
      </header>

      <main>
        <div class="wrapper">
          <div class="color-box" data-color="red">Red</div>
          <div class="color-box" data-color="blue">Blue</div>
          <div class="color-box" data-color="green">Green</div>
          <div class="color-box" data-color="yellow">Yellow</div>
        </div>

        <div class="greeting-form">
          <label for="name">Enter your name</label>
          <input type="text" id="nameInput" placeholder="Type Here" />
          <button type="button" id="greetBtn">Greet</button>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
